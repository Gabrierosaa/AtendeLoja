name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AtendeLoja.sln

      - name: Build
        run: dotnet build AtendeLoja.sln --no-restore -c Release

      - name: Test
        run: dotnet test AtendeLoja.sln --no-build -c Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem da API
        run: docker build -f docker/Dockerfile.api -t atendeloja-api:ci .

      - name: Build da imagem do Worker
        run: docker build -f docker/Dockerfile.worker -t atendeloja-worker:ci .
